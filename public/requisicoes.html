<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Requisições</title>
  <script>
    const token = localStorage.getItem('bo_token');
    if (!token) {
      window.location.href = 'bo-login.html';
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bo-style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    .req-dashboard {
      padding: 24px;
      color: white;
    }
    .req-cards {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .req-card {
      background: #1F2128;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      flex: 1;
      text-align: center;
      position: relative;
    }
    .req-card h3 {
      margin: 0;
      color: #8E929B;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .req-card p {
      margin: 8px 0 0 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
    }
    .req-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
    }
    .req-table th, .req-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #374151;
    }
    .req-table th {
      color: #8E929B;
      font-weight: 500;
    }
    .req-filter {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .req-action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      font-size: 0.8rem;
    }
    .btn-baixa { background: #10B981; }
    .btn-retorno { background: #F59E0B; }
  </style>
</head>
<body style="background: #0f1115;">
  <header class="bo-header">
    <div class="bo-header-left">
      <img src="/bo-assets/logo.png" alt="Logo" class="bo-logo">
      <div class="bo-header-title">Requisições Pendentes</div>
    </div>
    <div class="bo-header-right">
      <button class="bo-nav-btn" onclick="window.location.href='backoffice.html'">⬅ Voltar ao Kanban</button>
    </div>
  </header>

  <main class="req-dashboard">
    <div class="req-filter">
      <label>Filtrar por Técnico/Mala:</label>
      <select id="filtro-tecnico" style="padding: 8px; background: #1F2128; border: 1px solid #374151; color: white; border-radius: 4px; min-width: 200px;">
        <option value="">Todos</option>
      </select>
    </div>

    <div class="req-cards">
      <div class="req-card">
        <h3>Pendentes</h3>
        <p id="total-pendentes">0</p>
      </div>
      <div class="req-card">
        <h3>Baixadas/Retornadas</h3>
        <p id="total-baixadas">0</p>
      </div>
      <div class="req-card">
        <h3>Valor Total Pendente</h3>
        <p id="valor-pendente" style="color: #F59E0B;">R$ 0,00</p>
      </div>
      <div class="req-card" style="padding: 0; min-height: 120px;">
        <div id="gauge-meta" style="width: 100%; height: 100%; position: absolute; top:0; left:0;"></div>
      </div>
    </div>

    <div style="background: #1F2128; border: 1px solid #374151; border-radius: 8px; overflow: hidden; padding: 16px;">
      <h3 style="margin: 0 0 16px 0; color: #8E929B;">Lista de Requisições</h3>
      <table class="req-table">
        <thead style="background: #13141A;">
          <tr>
            <th>Nº REQ</th>
            <th>Pedido / Data</th>
            <th>Mala / Técnico</th>
            <th>Cliente / Máquina</th>
            <th>Peça (Qtd)</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="req-table-body">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/requisicoes.js?v=2"></script>
</body>
</html>
